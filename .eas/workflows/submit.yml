name: iOS production build and submit

on:
  push:
    branches: ['main']

jobs:
  build_android:
    name: Build Android
    type: build
    params:
      platform: android
      profile: production

  # 2. Build iOS
  build_ios:
    name: Build iOS
    type: build
    params:
      platform: ios
      profile: production

  # 3. Auto-Submit Android (Runs only after build_android succeeds)
  submit_android:
    name: Submit Android
    needs: [build_android]
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}

  # 4. Auto-Submit iOS (Runs only after build_ios succeeds)
  submit_ios:
    name: Submit iOS
    needs: [build_ios]
    type: testflight
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production