name: EAS Build & Submit

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  eas-build:
    name: EAS Build & Submit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: EAS Build iOS (Production)
        run: eas build --platform ios --profile production --auto-submit --non-interactive

      - name: EAS Build Android (Production)
        run: eas build --platform android --profile production --auto-submit --non-interactive